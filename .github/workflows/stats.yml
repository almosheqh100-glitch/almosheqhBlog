name: Refresh article view counts
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: wordpress-stats-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Refresh public lifetime counts
        env:
          WP_STATS_TOKEN: ${{ secrets.WP_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_views.py
